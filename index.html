<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>电影里的职场女主</title>
  <meta name="description" content="选择一位电影职场女性，用她的思维方式重新看待你的职场问题。">
  <style>
    :root{
      --bg:#F0EEE9; --ink:#242320; --muted:#77736b; --line:#d8d4cc;
      --card:#f7f5f1; --dark:#292824; --white:#fffdfa;
      --wine:#6C2B33; --wine-deep:#56202A; --wine-text:#F2E4E1; --wine-sub:#C9A9A3;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans","Microsoft YaHei",sans-serif}
    button,textarea{font:inherit}
    .wrap{max-width:1180px;margin:auto;padding:30px 28px 60px}
    header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 54px}
    .brand{font-family:Georgia,serif;font-size:20px;letter-spacing:.02em}
    .nav{font-size:12px;color:var(--wine);letter-spacing:.08em}
    .hero{display:grid;grid-template-columns:1.05fr .95fr;gap:70px;align-items:end;padding:30px 0 54px}
    .eyebrow{font-size:11px;letter-spacing:.18em;color:var(--wine);text-transform:uppercase;margin-bottom:22px}
    h1{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:clamp(48px,6vw,78px);line-height:.98;letter-spacing:-.045em;margin:0}
    .hero p{font-size:16px;line-height:1.9;color:#625f58;max-width:450px;margin:0 0 6px}
    .rule{border-top:1px solid var(--line)}
    .section-head{display:flex;justify-content:space-between;align-items:end;padding:28px 0 18px}
    .section-title{font-family:Georgia,serif;font-size:22px}
    .hint{font-size:12px;color:var(--muted)}
    .characters{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
    .character{position:relative;text-align:left;border:1px solid var(--line);background:var(--card);cursor:pointer;transition:.2s ease;overflow:hidden;border-radius:2px;padding:0}
    .character:hover{transform:translateY(-3px);box-shadow:0 10px 26px rgba(36,35,32,.14)}
    .character.active{border-color:var(--wine-deep);box-shadow:0 8px 22px rgba(108,43,51,.3)}
    .char-img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;filter:grayscale(100%) contrast(1.03);transition:filter .25s ease}
    .character.active .char-img,.character:hover .char-img{filter:none}
    .char-body{padding:13px 14px 16px}
    .character.active .char-body{background:var(--wine)}
    .number{font-size:10px;letter-spacing:.12em;color:var(--muted);margin-bottom:8px}
    .active .number{color:var(--wine-sub)}
    .name{font-family:Georgia,serif;font-size:17px;margin-bottom:6px}
    .name span{font-size:12px;color:var(--muted);margin-left:4px}
    .active .name{color:var(--wine-text)}
    .active .name span{color:var(--wine-sub)}
    .role{font-size:11px;color:var(--muted);line-height:1.6}
    .active .role{color:var(--wine-sub)}
    .chat{margin-top:54px;border:1px solid var(--line);background:rgba(255,253,250,.55)}
    .chat-top{padding:22px 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
    .selected{display:flex;align-items:center;gap:12px}
    .selected-img{width:38px;height:38px;border-radius:50%;object-fit:cover;border:1px solid var(--wine-deep)}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--wine-deep)}
    .selected strong{font-family:Georgia,serif;font-size:18px;font-weight:400}
    .selected span{font-size:11px;color:var(--muted);margin-left:7px}
    .messages{min-height:310px;max-height:520px;overflow:auto;padding:30px 24px}
    .empty{height:250px;display:grid;place-items:center;text-align:center;color:var(--muted);font-family:Georgia,serif;font-size:21px;line-height:1.55}
    .msg{display:flex;margin:0 0 22px}
    .msg.user{justify-content:flex-end}
    .bubble{max-width:760px;padding:15px 18px;line-height:1.8;font-size:14px;white-space:pre-wrap}
    .assistant .bubble{background:#e8e4dd}
    .user .bubble{background:var(--wine);color:var(--wine-text)}
    .composer{border-top:1px solid var(--line);padding:16px;display:flex;gap:10px;align-items:flex-end}
    textarea{flex:1;border:0;background:transparent;resize:none;outline:none;min-height:50px;max-height:140px;padding:10px 8px;line-height:1.6;color:var(--ink);transition:box-shadow .2s ease;border-radius:4px}
    textarea:focus{box-shadow:0 0 0 2px rgba(108,43,51,.35)}
    textarea::placeholder{color:#9a968e}
    .send{border:0;background:var(--wine);color:var(--wine-text);padding:12px 20px;cursor:pointer;transition:background .2s ease;border-radius:2px}
    .send:hover{background:var(--wine-deep)}
    .send:disabled{opacity:.4;cursor:not-allowed}
    .suggestions{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 16px}
    .suggestion{border:1px solid var(--line);background:transparent;padding:8px 11px;font-size:11px;color:#69655e;cursor:pointer;transition:.2s ease;border-radius:2px}
    .suggestion:hover{border-color:var(--wine);color:var(--wine)}
    footer{padding-top:26px;color:#8b877f;font-size:10px;line-height:1.7}
    @media(max-width:850px){
      .hero{grid-template-columns:1fr;gap:30px}
      .characters{grid-template-columns:repeat(2,1fr)}
    }
    @media(max-width:520px){
      .wrap{padding:22px 16px 40px}
      header{padding-bottom:35px}
      .hero{padding-top:10px}
      .characters{grid-template-columns:1fr 1fr}
      .chat{margin-top:35px}
    }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Career Muse</div>
    <div class="nav">电影 × 职场 × AI</div>
  </header>

  <section class="hero">
    <div>
      <div class="eyebrow">换一种方式，重新看待职场</div>
      <h1>如果由她来<br>处理你的职场问题。</h1>
    </div>
    <p>选择一位电影里的职业女性，把你的真实困境交给她。她会用她的方式给到你答案。</p>
  </section>

  <div class="rule"></div>
  <section>
    <div class="section-head">
      <div class="section-title">选择你的女主</div>
      <div class="hint">你也可以随时切换角色</div>
    </div>
    <div class="characters" id="characters"></div>
  </section>

  <section class="chat">
    <div class="chat-top">
      <div class="selected">
        <img class="selected-img" id="selectedImg" src="miranda.png" alt="Miranda">
        <div><strong id="selectedName">Miranda 米兰达</strong><span id="selectedRole">权力谋略家</span></div>
      </div>
    </div>
    <div class="messages" id="messages">
      <div class="empty">把你的困境告诉她。<br><span style="font-size:14px">她会先判断问题，再告诉你下一步。</span></div>
    </div>
    <div class="suggestions" id="suggestions">
      <button class="suggestion">我能力不错，但没人看见</button>
      <button class="suggestion">怎么进入公司的核心项目</button>
    </div>
    <div class="composer">
      <textarea id="input" placeholder="写下你的职场问题……" rows="1"></textarea>
      <button class="send" id="send">问她</button>
    </div>
  </section>

  <footer>
    Career Muse 是一个实验性的 AI 职场思维工具。角色回答基于电影人物的公开叙事特征进行抽象，不代表电影角色本人，也不复现电影原台词。
  </footer>
</div>

<script>
const characters = [
  {id:"miranda",name:"Miranda",cn:"米兰达",role:"权力谋略家",film:"《穿普拉达的女王》",tag:"权力",img:"miranda.png"},
  {id:"elle",name:"Elle",cn:"艾丽",role:"自信挑战者",film:"《律政俏佳人》",tag:"自信",img:"elle.png"},
  {id:"jules",name:"Jules",cn:"朱尔斯",role:"组织构建者",film:"《实习生》",tag:"管理",img:"jules.png"},
  {id:"molly",name:"Molly",cn:"茉莉",role:"人脉架构师",film:"《茉莉牌局》",tag:"人脉",img:"MOLLY.png"},
  {id:"katherine",name:"Katherine",cn:"凯瑟琳",role:"安静的专家",film:"《隐藏人物》",tag:"专业",img:"katherine.png"}
];

let selected = characters[0];
let history = [];

const charBox = document.getElementById("characters");
const messages = document.getElementById("messages");
const input = document.getElementById("input");
const send = document.getElementById("send");

function renderCharacters(){
  charBox.innerHTML = characters.map((c,i)=>`
    <button class="character ${c.id===selected.id?'active':''}" data-id="${c.id}">
      <img class="char-img" src="${c.img}" alt="${c.name} ${c.cn}" loading="lazy">
      <div class="char-body">
        <div class="number">0${i+1} / ${c.tag}</div>
        <div class="name">${c.name}<span>${c.cn}</span></div>
        <div class="role">${c.role}<br>${c.film}</div>
      </div>
    </button>`).join("");
  document.querySelectorAll(".character").forEach(el=>{
    el.onclick=()=>{selected=characters.find(c=>c.id===el.dataset.id); history=[]; clearChat(); updateSelected(); renderCharacters();}
  });
}
function updateSelected(){
  document.getElementById("selectedName").textContent=selected.name+" "+selected.cn;
  document.getElementById("selectedRole").textContent=selected.role;
  const img=document.getElementById("selectedImg"); img.src=selected.img; img.alt=selected.name+" "+selected.cn;
}
function clearChat(){
  messages.innerHTML='<div class="empty">把你的困境告诉她。<br><span style="font-size:14px">她会先判断问题，再告诉你下一步。</span></div>';
}
function addMessage(role,text){
  const empty=messages.querySelector(".empty"); if(empty) empty.remove();
  const el=document.createElement("div"); el.className="msg "+role;
  const b=document.createElement("div"); b.className="bubble"; b.textContent=text;
  el.appendChild(b); messages.appendChild(el); messages.scrollTop=messages.scrollHeight;
}
async function ask(){
  const text=input.value.trim(); if(!text || send.disabled) return;
  addMessage("user",text); history.push({role:"user",content:text});
  input.value=""; input.style.height="auto"; send.disabled=true; send.textContent="思考中…";
  try{
    const res=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({character:selected.id,message:text,history:history.slice(-8)})});
    const data=await res.json();
    if(!res.ok) throw new Error((data.error||"Request failed")+(data.detail?(" · "+data.detail):""));
    addMessage("assistant",data.answer); history.push({role:"assistant",content:data.answer});
  }catch(e){
    addMessage("assistant","暂时无法连接 AI。请检查 API 部署和环境变量配置。\n\n"+e.message);
  }finally{send.disabled=false;send.textContent="问她";}
}
send.onclick=ask;
input.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();ask()}});
input.addEventListener("input",()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,140)+"px"});
document.querySelectorAll(".suggestion").forEach(b=>b.onclick=()=>{input.value=b.textContent;input.focus()});
renderCharacters(); updateSelected();
</script>
</body>
</html>
